<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord parent · NotesQC</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>(function(){var t=localStorage.getItem('coba_theme');if(t==='dark')document.documentElement.classList.add('dark');})()</script>
  <style>
    .parent-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .35rem .75rem; border-radius: 999px;
      background: #dbeafe; color: #1e40af;
      font-size: .8rem; font-weight: 600;
      margin-bottom: 1.25rem;
    }
    html.dark .parent-badge { background: #1e3a5f; color: #93c5fd; }

    .child-selector {
      display: flex; flex-wrap: wrap; gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .child-btn {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .875rem; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--surface);
      cursor: pointer; font-size: .875rem; font-weight: 500;
      color: var(--text-1); transition: border-color .15s;
    }
    .child-btn:hover { border-color: var(--primary); }
    .child-btn.active {
      border-color: var(--primary); background: var(--primary-l);
      color: var(--primary);
    }
    .child-btn img, .child-btn .c-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
    }
    .child-btn .c-avatar {
      background: #7c3aed; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700;
    }

    .no-children {
      text-align: center; padding: 3rem 1rem;
    }
    .no-children .icon { font-size: 2.5rem; margin-bottom: .75rem; }

    .readonly-notice {
      padding: .6rem 1rem; border-radius: 6px;
      background: var(--bg-2); border: 1px solid var(--border);
      font-size: .85rem; color: var(--text-2);
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <nav class="nav" id="main-nav">
    <a class="nav-brand" href="/parent-dashboard">
      <img src="/logo/notesQC_white.png" alt="NotesQC" class="nav-logo">
    </a>
    <div class="nav-right">
      <span class="nav-email" id="nav-parent-name"></span>
      <button class="theme-btn" id="themeBtnNav" title="Basculer le thème" aria-label="Basculer le thème"><span data-theme-icon></span></button>
      <button class="nav-logout" id="navLogout">Déconnexion</button>
    </div>
  </nav>

  <div class="page">
    <div class="container">

      <div class="parent-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Espace parent
      </div>

      <!-- Sélecteur d'enfant -->
      <div class="child-selector" id="child-selector">
        <div style="opacity:.6;font-size:.9rem">Chargement…</div>
      </div>

      <!-- Pas d'enfants -->
      <div class="no-children hidden" id="no-children">
        <div class="icon">👶</div>
        <h3 style="font-size:1.1rem;font-weight:600;margin-bottom:.5rem">Aucun enfant lié</h3>
        <p class="text-sm text-muted mb-2">Ajoutez un enfant depuis votre compte pour voir ses notes.</p>
        <a href="/parent-account" class="btn btn-primary">Gérer mes enfants</a>
      </div>

      <!-- Contenu principal (visible quand un enfant est sélectionné) -->
      <div id="main-content" class="hidden">

        <div class="readonly-notice">
          Vous consultez les notes de <strong id="active-child-name"></strong>.
        </div>

        <!-- Header stats global -->
        <div class="global-header" id="global-header">
          <div class="flex-between" style="align-items:flex-start">
            <h2>Aperçu général</h2>
          </div>
          <div id="global-stats-row" class="global-stats-row">
            <div style="opacity:.6;font-size:.9rem">Chargement…</div>
          </div>
          <button class="global-expand-btn" id="global-expand-btn">▼ Afficher plus</button>
          <div class="global-expanded hidden" id="global-expanded">
            <div class="global-chart-wrap">
              <canvas id="global-chart" height="90"></canvas>
            </div>
          </div>
        </div>

        <!-- Filtres année -->
        <div id="year-filter-wrap" style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:1rem"></div>

        <!-- Cartes cours -->
        <div id="courses-grid" class="courses-grid">
          <div style="opacity:.6;font-size:.9rem">Chargement…</div>
        </div>

        <!-- Détail cours -->
        <div id="course-detail" class="course-detail hidden">
          <button class="btn btn-ghost btn-sm" id="back-btn" style="margin-bottom:.75rem">← Retour</button>
          <div id="detail-header" class="detail-header"></div>
          <canvas id="detail-chart" height="120" style="margin:1rem 0"></canvas>
          <div id="detail-controls" style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.75rem"></div>
          <div id="assignments-list"></div>
        </div>

      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/parent-dashboard" class="active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Tableau de bord
    </a>
    <a href="/parent-account">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      Mon compte
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/parent-dashboard.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/cookie-banner.js"></script>
</body>
</html>
