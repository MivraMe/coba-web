<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Espace parent · NotesQC</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>(function(){var t=localStorage.getItem('coba_theme');if(t==='dark')document.documentElement.classList.add('dark');})()</script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="/logo/notesQc_black.png" alt="NotesQC" class="auth-logo-img">
        <p class="auth-sub">Réinitialiser le mot de passe parent</p>
      </div>

      <div id="alert" class="alert alert-hidden"></div>

      <!-- Étape 1 : saisie du courriel -->
      <div id="step-email">
        <p class="text-sm text-muted mb-2">Entrez le courriel associé à votre compte parent. Vous recevrez un code à 6 chiffres.</p>
        <div class="form-group">
          <label class="form-label" for="reset-email">Courriel</label>
          <input type="email" id="reset-email" class="form-control" placeholder="vous@exemple.com" autocomplete="email">
        </div>
        <button class="btn btn-primary btn-block" id="btn-send-code">Envoyer le code</button>
        <p class="text-center mt-2 text-sm"><a href="/">← Retour à la connexion</a></p>
      </div>

      <!-- Étape 2 : saisie du code + nouveau mot de passe -->
      <div id="step-code" style="display:none">
        <p id="sent-msg" class="text-sm text-muted mb-2"></p>
        <div class="form-group">
          <label class="form-label" for="reset-code">Code à 6 chiffres</label>
          <input type="text" id="reset-code" class="form-control" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="letter-spacing:.2em;text-align:center;font-size:1.1rem">
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">Nouveau mot de passe</label>
          <input type="password" id="new-password" class="form-control" placeholder="8 caractères minimum" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password2">Confirmer le nouveau mot de passe</label>
          <input type="password" id="new-password2" class="form-control" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" id="btn-reset">Réinitialiser le mot de passe</button>
        <p class="text-center mt-1 text-sm"><a href="#" id="resend-link">Renvoyer le code</a></p>
      </div>

      <!-- Étape 3 : succès -->
      <div id="step-success" style="display:none">
        <div class="alert alert-success" style="display:block">Mot de passe réinitialisé avec succès.</div>
        <a href="/" class="btn btn-primary btn-block mt-2">Se connecter</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/cookie-banner.js"></script>
  <script>
    const alertEl = document.getElementById('alert');
    let savedEmail = '';

    document.getElementById('btn-send-code').addEventListener('click', async () => {
      const email = document.getElementById('reset-email').value.trim();
      if (!email) { showAlert(alertEl, 'Entrez votre courriel.'); return; }
      const btn = document.getElementById('btn-send-code');
      setLoading(btn, true, 'Envoi…');
      const res = await fetch('/api/parent/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      setLoading(btn, false, 'Envoyer le code');
      const data = await res.json();
      if (!res.ok) { showAlert(alertEl, data.error || 'Erreur lors de l\'envoi'); return; }
      savedEmail = email;
      hideAlert(alertEl);
      document.getElementById('sent-msg').textContent = `Un code a été envoyé à ${email}. Valide 15 minutes.`;
      document.getElementById('step-email').style.display = 'none';
      document.getElementById('step-code').style.display = 'block';
      document.getElementById('reset-code').focus();
    });

    document.getElementById('reset-email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-send-code').click();
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
      const code = document.getElementById('reset-code').value.trim();
      const newPwd = document.getElementById('new-password').value;
      const newPwd2 = document.getElementById('new-password2').value;
      hideAlert(alertEl);
      if (!code || !newPwd || !newPwd2) { showAlert(alertEl, 'Veuillez remplir tous les champs.'); return; }
      if (newPwd !== newPwd2) { showAlert(alertEl, 'Les mots de passe ne correspondent pas.'); return; }
      if (newPwd.length < 8) { showAlert(alertEl, 'Le mot de passe doit comporter au moins 8 caractères.'); return; }
      const btn = document.getElementById('btn-reset');
      setLoading(btn, true, 'Réinitialisation…');
      const res = await fetch('/api/parent/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: savedEmail, code, new_password: newPwd }),
      });
      setLoading(btn, false, 'Réinitialiser le mot de passe');
      const data = await res.json();
      if (!res.ok) { showAlert(alertEl, data.error || 'Code invalide ou expiré'); return; }
      document.getElementById('step-code').style.display = 'none';
      document.getElementById('step-success').style.display = 'block';
    });

    document.getElementById('resend-link').addEventListener('click', async e => {
      e.preventDefault();
      hideAlert(alertEl);
      const res = await fetch('/api/parent/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: savedEmail }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert(alertEl, data.error || 'Erreur lors du renvoi'); return; }
      showAlert(alertEl, 'Nouveau code envoyé.', 'success');
    });
  </script>
</body>
</html>
